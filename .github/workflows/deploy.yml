name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cuckoo-catalog
        # 如果 secrets 未配置，此步骤将失败，需要手动配置
        continue-on-error: true
      
      - name: Check deployment status
        if: failure()
        run: |
          echo "❌ Cloudflare 部署失败"
          echo ""
          echo "可能的原因："
          echo "1. GitHub Secrets 未配置 (CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID)"
          echo "2. Cloudflare 项目尚未创建"
          echo "3. API Token 权限不足"
          echo ""
          echo "请执行以下步骤："
          echo "1. 通过本地脚本部署: bash deploy.sh"
          echo "2. 或在 GitHub Secrets 中配置凭证后重试"
          exit 1
